<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseNote | Pre-consultation GP report</title>
    <style>
      @page { size: A4; margin: 12mm; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px 16px; background: #f5f3ee; color: #1d1d1b; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 760px; margin: 0 auto; background: #fff; padding: 28px 32px; border-radius: 8px; }
      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #1d1d1b; padding-bottom: 10px; }
      h1 { font-size: 22px; margin: 0; }
      h2 { font-size: 15px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
      .meta { margin: 4px 0 0; color: #4a4a46; font-size: 13px; }
      .banner { margin: 12px 0 0; padding: 8px 10px; background: #fff4d6; border: 1px solid #c79a1c; font-size: 13px; }
      button { font: inherit; font-weight: 600; padding: 10px 18px; min-height: 44px; border: 2px solid #1d1d1b; background: #1d1d1b; color: #fff; border-radius: 6px; cursor: pointer; }
      ul { margin: 0; padding-left: 20px; }
      .flags li { margin-bottom: 2px; }
      .muted { color: #4a4a46; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border: 1px solid #b9b6ad; padding: 3px 8px; text-align: left; }
      th { background: #ece9e1; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .missed { font-weight: 700; }
      tr.mismatch td { background: #fde2e2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr.mismatch td:first-child { box-shadow: inset 4px 0 0 #9b1c1c; }
      .legend { margin: 4px 0 0; font-size: 12px; }
      .columns { display: grid; gap: 0 24px; }
      .columns > section { break-inside: avoid; }
      @media (min-width: 640px) { .columns { grid-template-columns: 1fr 1fr; } }
      .summary { padding: 10px 12px; background: #f1f6f4; border-left: 4px solid #2d6a5a; }
      .error { color: #9b1c1c; font-weight: 600; }
      footer { margin-top: 16px; font-size: 12px; color: #4a4a46; }
      @media print {
        body { background: #fff; padding: 0; font-size: 11px; }
        main { max-width: none; padding: 0; border-radius: 0; }
        button { display: none; }
        h1 { font-size: 18px; }
        h2 { font-size: 12px; margin: 10px 0 4px; }
        p { margin: 4px 0; }
        .summary, .flags, .columns > section { break-inside: avoid; }
        .columns { grid-template-columns: 1fr 1fr; }
        table { font-size: 10.5px; }
        th, td { padding: 2px 6px; }
        footer { margin-top: 10px; font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main id="report" aria-live="polite"><p>Loading report…</p></main>
    <script type="module">
      const root = document.querySelector('#report')
      const patientId = new URLSearchParams(location.search).get('patientId') || 'synthetic-demo-patient'

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])
      const list = (items, empty, className = '') => items.length ? `<ul class="${className}">${items.map((item) => `<li>${item}</li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`
      const plural = (count, singular, pluralForm = `${singular}s`) => `${count} ${count === 1 ? singular : pluralForm}`
      const capitalize = (text) => text.charAt(0).toUpperCase() + text.slice(1)
      const medicationLabels = {
        reported_taken: 'patient reported taken',
        reported_missed: 'patient reported missed',
        reported_not_yet_taken: 'patient reported not yet taken',
        uncertain: 'patient unsure',
      }
      const medicationLabel = (state) => medicationLabels[state] ?? state

      function render(report) {
        const { metrics, config } = report
        const bp = metrics.bloodPressure
        const mismatches = new Map(metrics.medicationMismatches.map((item) => [item.date, item]))
        const rows = report.daily.map((day) => {
          const mismatch = mismatches.get(day.date)
          return `
          <tr class="${mismatch ? 'mismatch' : ''}">
            <td>${day.date}</td>
            <td class="num">${day.systolic === null ? '–' : `${day.systolic}/${day.diastolic}`}</td>
            <td class="${day.dispenser === 'missed' ? 'missed' : ''}">${day.dispenser ?? '–'}${mismatch ? ` · ${escapeHtml(medicationLabel(mismatch.patientReport))}` : ''}</td>
          </tr>`
        }).join('')
        const symptoms = metrics.checkins.symptomDays.map((item) => `${escapeHtml(capitalize(item.label))}: ${plural(item.days, 'day')}`)
        const reviews = metrics.checkins.reviewItems.map((item) => `${item.date}: ${item.evidence.map((quote) => `“${escapeHtml(quote)}”`).join(' ')}`)
        const reports = metrics.checkins.medicationReports.map((item) => `${item.date}: ${escapeHtml(medicationLabel(item.state))}${item.evidence ? ` (“${escapeHtml(item.evidence)}”)` : ''}`)

        root.innerHTML = `
          <header>
            <div>
              <h1>Pre-consultation GP report</h1>
              <p class="meta">Patient: ${escapeHtml(report.syntheticPatientId)} · Period: ${metrics.period.from} to ${metrics.period.to} (${metrics.period.days} days) · Generated: ${new Date(report.generatedAt).toLocaleString()}</p>
            </div>
            <button type="button" id="printButton">Print</button>
          </header>
          <p class="banner">Synthetic demonstration data. Not a diagnosis, triage result or clinical advice. Targets ${config.systolicTarget}/${config.diastolicTarget} mmHg are configurable demo values.</p>

          <h2>Summary</h2>
          <div class="summary">
            <p>${escapeHtml(report.summary.text)}</p>
            <p class="muted">${report.summary.source === 'llm' ? 'AI-written summary of the figures below. Check against the data.' : 'Template summary (AI summary unavailable).'}</p>
          </div>

          <h2>Flags</h2>
          ${list(report.flags.map((flag) => escapeHtml(flag.message)), 'No flags raised.', 'flags')}

          <div class="columns">
            <section>
              <h2>Blood pressure and dispenser</h2>
              <p>${plural(bp.readings, 'reading')}, ${plural(bp.daysWithoutReading, 'day')} without a reading. Average ${bp.averageSystolic ?? '–'}/${bp.averageDiastolic ?? '–'} mmHg, systolic range ${bp.minSystolic ?? '–'}–${bp.maxSystolic ?? '–'}. Dispenser: ${metrics.dispenser.dispensed} of ${metrics.dispenser.scheduled} dispensed, ${metrics.dispenser.missed} missed (dispensed does not confirm the dose was taken).</p>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>BP (mmHg)</th><th>Dispenser</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
              ${mismatches.size ? '<p class="legend muted">Highlighted rows: patient report and dispenser disagree.</p>' : ''}
            </section>

            <section>
              <h2>Check-ins (${metrics.checkins.confirmed} confirmed)</h2>
              <p><strong>Symptoms</strong></p>
              ${list(symptoms, 'No symptoms reported.')}
              <p><strong>Patient-reported medication</strong></p>
              ${list(reports, 'No medication reports.')}
              <p><strong>Marked for clarification</strong></p>
              ${list(reviews, 'None.')}
            </section>
          </div>

          <footer>${plural(metrics.checkins.excludedUnconfirmed, 'unconfirmed check-in')} excluded. Report schema ${escapeHtml(report.schemaVersion)}.</footer>
        `
        document.querySelector('#printButton').addEventListener('click', () => window.print())
      }

      try {
        const response = await fetch(`/api/reports/gp?patientId=${encodeURIComponent(patientId)}`)
        const payload = await response.json()
        if (!response.ok) throw new Error(payload?.error?.message || 'Report could not be loaded')
        render(payload)
      } catch (error) {
        root.innerHTML = `<p class="error">${escapeHtml(error instanceof Error ? error.message : 'Report could not be loaded')}</p>`
      }
    </script>
  </body>
</html>
